name: regenerate assets

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC, so stats/langs stay fresh
  push:
    paths:
      - "assets/skills.json"
      - "assets/portrait_source.*"
      - "scripts/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow numpy matplotlib opencv-python-headless

      - name: Build skill radar
        run: python scripts/radar.py assets/skills.json -o assets/radar

      - name: Build dot-matrix portrait (if source photo exists)
        run: |
          if ls assets/portrait_source.* >/dev/null 2>&1; then
            src=$(ls assets/portrait_source.* | head -n1)
            python scripts/dotify.py "$src" -o assets/portrait --cols 85 --detail 0.55 --color --remove-bg --darken 0.82 --animate
          fi

      - name: Build self-hosted GitHub stats + language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py ${{ github.repository_owner }} -o assets/card-github

      - name: Commit changed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset origin/main
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: regenerate profile assets"
          git push origin HEAD:main
